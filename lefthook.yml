# Lefthook — git hooks manager (https://github.com/evilmartians/lefthook)
#
# Install once per developer:
#   brew install lefthook && lefthook install
#
# Hooks run automatically on git operations. Skip a hook with:
#   LEFTHOOK=0 git commit ...
commit-msg:
  commands:
    commitlint:
      run: sed '/^#/d; /^diff --git/,$d' {1} | sed '/^$/d' | docker run --rm -i -v $(pwd):/workspace -w /workspace commitlint/commitlint:latest

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "custom_components/**/*.py"
      run: ruff check {staged_files}
      fail_text: "Ruff lint errors. Auto-fix with: ruff check --fix custom_components/"

    format:
      glob: "custom_components/**/*.py"
      run: ruff format --check {staged_files}
      fail_text: "Formatting issues. Auto-fix with: ruff format custom_components/"

pre-push:
  parallel: true
  commands:
    # Unit + soak share the same .venv. Running them as two parallel
    # lefthook commands would race on the rm -rf / uv venv / uv pip
    # install steps when .venv is absent or stale, producing
    # nondeterministic pre-push failures. Keep both pytest invocations
    # inside one command so the venv setup runs exactly once.
    test-python:
      glob: "**/*.py"
      # Same plugin cap as .gitlab-ci.yml — uv installs the pinned pre-release
      # exactly as pip does, so an uncapped venv fails what CI passes.
      run: >-
        REQUIRED_PY="$(cat .python-version)";
        if [ -d ".venv" ] && ! .venv/bin/python -c "import sys; v='${REQUIRED_PY}'.split('.'); sys.exit(0 if sys.version_info[:len(v)] == tuple(int(p) for p in v) else 1)" 2>/dev/null; then
          echo "⚙ .venv uses wrong Python (need ${REQUIRED_PY}) — recreating...";
          rm -rf .venv;
        fi &&
        if [ ! -d ".venv" ]; then
          echo "⚙ No .venv found — creating one with Python ${REQUIRED_PY}...";
          uv venv .venv --python "${REQUIRED_PY}" &&
          uv pip install --python .venv/bin/python pytest pytest-asyncio 'pytest-homeassistant-custom-component<0.13.358' 'ruamel.yaml>=0.18' anthropic home-assistant-intents hassil;
        fi &&
        .venv/bin/python -m pytest tests/ -q &&
        echo "⚙ Running memory-leak soak tests..." &&
        .venv/bin/python -m pytest tests/ -m soak -q
      fail_text: "Python tests failed. Run: pytest tests/ -v (or pytest tests/ -m soak -v for soak)"

    # Tests and build share one node_modules, and the build's toolchain
    # decides its output — build.js runs prettier over src/ and again over
    # panel.js, so the bundle's bytes are a function of the installed
    # prettier, not just of the sources. An install that has drifted from
    # package-lock.json therefore produces a bundle CI will reject, and the
    # failure is silent locally: the hook rewrites the working tree, the
    # stale commit is pushed regardless, and the diff looks like repo drift
    # rather than a stale install. `npm ci` is the fix because it is what CI
    # runs; at ~0.5s for 46 packages the cheaper "check, then reinstall"
    # variants buy nothing, and the obvious ones are wrong anyway —
    # `npm ls` validates against package.json's RANGE, so the day 3.9.8
    # ships it calls a lockfile mismatch valid.
    #
    # Kept in ONE command for the reason test-python is: `npm ci` deletes and
    # repopulates node_modules, so as a separate `parallel: true` command it
    # would race vitest reading out of the directory being replaced.
    frontend:
      glob:
        - "custom_components/selora_ai/frontend/src/**/*.js"
        - "custom_components/selora_ai/frontend/__tests__/**/*.js"
        - "custom_components/selora_ai/frontend/build.js"
        - "custom_components/selora_ai/frontend/build-id.js"
        - "custom_components/selora_ai/frontend/postbuild.js"
        - "custom_components/selora_ai/frontend/vitest.config.mjs"
        - "custom_components/selora_ai/frontend/package.json"
        - "custom_components/selora_ai/frontend/package-lock.json"
      # The staleness check mirrors the CI frontend job: a rebuild that
      # changes tracked files means the committed bundle does not match its
      # sources. Caught here it is a one-line fix; caught in CI it is a red
      # pipeline on a merge request.
      #
      # Compared against HEAD, not the index. A bare `git diff` asks whether
      # the tree differs from what is STAGED, so the recovery path this guard
      # itself provokes defeats it: the first push rebuilds, the developer
      # runs `git add` and pushes again without committing, the check passes,
      # and the stale commit goes out anyway.
      run: >-
        cd custom_components/selora_ai/frontend &&
        npm ci --silent &&
        npx vitest run &&
        npm run build &&
        cd ../../.. &&
        git diff --quiet HEAD -- custom_components/selora_ai/frontend
      fail_text: "Frontend tests, build, or bundle freshness failed. If the build itself passed, the rebuild changed tracked files — commit them (git add custom_components/selora_ai/frontend && git commit), or stash unrelated uncommitted frontend edits first, since the build reflects the working tree rather than HEAD."

    lint-all:
      run: ruff check custom_components/
      fail_text: "Ruff lint errors. Auto-fix with: ruff check --fix custom_components/"

    format-all:
      run: ruff format --check custom_components/
      fail_text: "Formatting issues. Auto-fix with: ruff format custom_components/"

    test-release-script:
      glob:
        - "scripts/github-release.mjs"
        - "scripts/github-release.test.mjs"
      run: node --test scripts/github-release.test.mjs
      fail_text: "Release script tests failed. Run: node --test scripts/github-release.test.mjs"

    validate-hacs:
      glob: "custom_components/selora_ai/manifest.json"
      run: python3 scripts/validate_hacs.py
      fail_text: "HACS validation failed. See output above."

    validate-manifest:
      glob: "custom_components/selora_ai/manifest.json"
      run: python3 scripts/validate_manifest.py
      fail_text: "Manifest validation failed. See output above."

    validate-hassfest:
      glob: "custom_components/selora_ai/**"
      run: 'mkdir -p .hassfest_tmp && rsync -a --delete --exclude node_modules custom_components/ .hassfest_tmp/custom_components/ && docker run --rm -v "$(pwd)/.hassfest_tmp/custom_components:/github/workspace/custom_components" ghcr.io/home-assistant/hassfest; rc=$?; rm -rf .hassfest_tmp; exit $rc'
      fail_text: "Hassfest validation failed. See output above."
